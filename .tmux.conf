# Tmux settings

# Set XTerm key bindings
setw -g xterm-keys on

# Pass Ctrl+Enter through to programs in the pane.
# By default tmux neither asks the outer terminal to report modified keys nor
# honors a program's request for them, so Ctrl+Enter reaches the pane as a
# plain Enter (both are byte 0x0D). Worse, on macOS 15+ Control-Return is the
# system "show context menu" shortcut, and iTerm2 only suppresses that menu when
# the terminal is in a mode that can report Ctrl+Enter. So without these lines,
# Ctrl+Enter in Claude Code pops iTerm2's right-click menu instead of "send now".
#   extended-keys on   -> forwards modified keys to panes whose program asks
#                         for them. tmux itself requests extended keys from
#                         terminals that support them.
#   extkeys feature    -> tells tmux the outer xterm-like terminal supports this
#                         (iTerm2 is auto-detected; this covers other TERMs).
# iTerm2 maps Shift+Return to LF (Ctrl+J), which inserts a line break in Codex
# and Claude Code even when tmux cannot report Shift+Enter as a modified key.
# Takes effect on the next attach: reload (prefix r), then detach and re-attach.
# Fallback that works without any of this: Ctrl+X Ctrl+S is Claude Code's chord
# for "send now" (chat:sendNow, Claude Code >= 2.1.275).
# Older tmux versions do not have every extended-key option. -q skips only
# options they do not recognize, while keeping supported options active.
set -sq extended-keys on
set -sq extended-keys-format csi-u
set -asq terminal-features 'xterm*:extkeys'

# Set colors
set-option -g default-terminal "screen-256color"

# Set reload key to r
bind r source-file ~/.tmux.conf

# Count sessions start at 1
set -g base-index 1

# Use vim bindings
setw -g mode-keys vi

# Remap window navigation to vim
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-h select-pane -L
bind-key -n M-l select-pane -R

# Make inactive panes dim
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=colour0'

# Set the title bar
set -g set-titles on
set -g set-titles-string '#h'

# Pass agent turn-complete bells through to iTerm's tab indicator.
set -g visual-bell off

# Set status bar
set -g status-bg black
set -g status-fg white
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set -g status-left "#[fg=blue]#(hostname -s) #[fg=white]"
set -g status-justify centre
set -g status-right '#[fg=Cyan]#S #[fg=white]%a %d %b %R'
set -g window-status-format '#{P:#{?@agent_waiting,#[fg=yellow]#[bold],}}#I:#W#{P:#{?@agent_waiting,[#{pane_index}],}}#F#[default]'
set -g window-status-current-format '#{P:#{?@agent_waiting,#[fg=yellow]#[bold],}}#I:#W#{P:#{?@agent_waiting,[#{pane_index}],}}#F#[default]'
# Keep Ctrl held after the prefix to acknowledge the selected pane.
bind-key -T prefix C-f set-option -p -u @agent_waiting \; refresh-client -S

set-option -g renumber-windows on

# get rid of esc delay
set -s escape-time 0

# rearrange windows
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

bind-key -n M-, select-window -p
bind-key -n M-. select-window -n

# Set new panes to open in current directory
# bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Automatically rename windows to current directory
set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# rebind prefix
unbind C-b
set-option -g prefix C-a

set -g mouse on
# Select panes without sending a plain left-click to programs inside them.
bind-key -T root MouseDown1Pane select-pane -t =

# Use vim keybindings in copy mode
setw -g mode-keys vi
# Setup 'v' to begin selection as in Vim
# bind-key -t vi-copy v begin-selection # old tmux
unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-selection

set-option -g history-limit 100000
# unbind -T copy-mode-vi MouseDragEnd1Pane

# Resurrect is installed separately on each host. Load it when present.
if-shell 'test -f ~/code/tmux-resurrect/resurrect.tmux' 'run-shell ~/code/tmux-resurrect/resurrect.tmux'
set -g @resurrect-capture-pane-contents 'on'


######################## Pinterest Stuff ########################
# Fix up SSH agent forwarding
if-shell "[[ $HOST =~ devrestricted-tanwang ]]" 'set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK_SET SSH_CONNECTION WINDOWID XAUTHORITY"'
if-shell "[[ $HOST =~ devrestricted-tanwang ]]" 'set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK_SET SSH_CONNECTION WINDOWID XAUTHORITY"'
if-shell "[[ $HOST =~ devrestricted-tanwang ]]" 'setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock'
if-shell 'test -x /usr/bin/zsh' 'set -g default-shell /usr/bin/zsh' 'set -g default-shell /bin/zsh'
